name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update && sudo apt-get install -y libpq5 postgresql-client
      - run: pip install -r requirements.txt
      - name: Secret scan (fail on likely keys)
        run: "! git grep -nE '(sk-ant-|sk-[A-Za-z0-9]{32,}|eyJhbGciOi|-----BEGIN [A-Z ]*PRIVATE KEY)' -- . ':!*.md' ':!.github/workflows/ci.yml'"
      - name: Unit + integration (real Postgres, RLS as non-owner role)
        run: scripts/test.sh
      - name: Browser smoke
        run: python -m playwright install --with-deps chromium && scripts/test.sh --ui
      - name: Generated web kernel and standalone build are current
        run: python scripts/build_web.py --check
      - name: Reference corpus validates and its generated seed is current
        run: python scripts/build_reference.py --check
