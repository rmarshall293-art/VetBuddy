# Discovery may build search queries only from these templates and the V0
# vocabulary (jurisdiction names, category labels, group labels). Raw facts
# and the person's own words never reach a query.
discovery:
  templates:
    jur_cat_vet: "{jurisdiction} {category} for veterans"
    jur_cat_guard: "{jurisdiction} {category} for National Guard members"
    jur_cat_family: "{jurisdiction} {category} for military families"
    cat_group: "{category} for {group}"
  search_endpoints: []

