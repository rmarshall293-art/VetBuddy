# Benefit Vault policy: the authored half of the vault registry.
#
# scripts/build_vault_registry.py combines this file with the research ledgers
# (data/research) and the recovered leads into data/reference/benefit_vault_registry.json,
# the single runtime source. Edit policy here, never in the generated registry;
# a test fails if the registry drifts from this file.
#
# Engineering governance text, not legal advice. Master Prompt v6 governs:
# agents orchestrate, gather and explain; they never decide.
version: "1.0.0"
as_of: "2026-10-27"

# The notice on every vault response is the Master Prompt v6 common notice,
# read by the registry builder from config/governance_language.yaml
# (common_notice). It is not restated here (C-09; vault defect VD15).
notice_from: governance_language.common_notice

publish_policy:
  # verified_only: only a VERIFIED record (named reviewer, gate G1) can be a
  # PRELIMINARY_MATCH; every other record that the facts fit is shown as a
  # HUMAN_REVIEW_REQUIRED lead with its official link.
  # preview_unverified: records read from the program's own page or an official
  # summary may show as PRELIMINARY_MATCH, flagged with their status.
  environments:
    production: verified_only
    staging: verified_only
    development: preview_unverified
    test: preview_unverified
  default_environment: production

review:
  stale_after_days: 180

grants:
  default_days: 30
  max_days: 90
  session_max_hours: 24

packets:
  ttl_seconds: 600

# Agent manifests. No manifest means no access. Every agent is pinned to
# may_issue_determinations: false; only the Benefit Vault agent may pull from
# other agents, and only through the broker with the person's grant. An agent
# may expose a fact only at the fact's own data class, never above V2.
# The ids below are the vault-side names for agents in the blueprint; mapping
# them to slice 03 agent ids is an integration step (defect register VD06).
agents:
  - agent_id: benefit_vault_agent
    name: Benefit Vault
    plane: 5
    role: Searches and matches benefits and deals and explains what the encoded rules say. Pulls facts from other agents only through the broker, with the person's grant.
    may_issue_determinations: false
    may_pull_from_agents: true
    highest_class_held: V2
    exposes: []
  - agent_id: service_profile_agent
    name: Service Profile
    plane: 2
    role: Holds the service history the person entered.
    may_issue_determinations: false
    may_pull_from_agents: false
    highest_class_held: V2
    exposes:
      - {fact_key: residence_state, data_class: V1}
      - {fact_key: duty_station_state, data_class: V1}
      - {fact_key: service_status, data_class: V1}
      - {fact_key: component, data_class: V1}
      - {fact_key: guard_state, data_class: V1}
      - {fact_key: on_active_duty_orders, data_class: V1}
      - {fact_key: active_duty_days, data_class: V1}
      - {fact_key: wartime_service, data_class: V1}
      - {fact_key: discharge, data_class: V2}
      - {fact_key: purple_heart, data_class: V2}
      - {fact_key: medal_of_honor, data_class: V2}
      - {fact_key: former_pow, data_class: V2}
  - agent_id: va_status_agent
    name: VA Status
    plane: 2
    role: Holds the rating facts the person copied from their VA letter. It also holds conditions, which are V4 and never leave it.
    may_issue_determinations: false
    may_pull_from_agents: false
    highest_class_held: V4
    exposes:
      - {fact_key: va_rating, data_class: V2}
      - {fact_key: rating_permanent_total, data_class: V2}
      - {fact_key: individual_unemployability, data_class: V2}
  - agent_id: household_agent
    name: Household
    plane: 2
    role: Holds family relationships for the family information packet.
    may_issue_determinations: false
    may_pull_from_agents: false
    highest_class_held: V2
    exposes:
      - {fact_key: relationship, data_class: V1}
      - {fact_key: age, data_class: V1}
      - {fact_key: gold_star_family, data_class: V2}
      - {fact_key: sponsor_status, data_class: V2}
      - {fact_key: sponsor_died_in_line_of_duty, data_class: V2}
  - agent_id: coverage_bridge_agent
    name: Coverage Bridge (migration 0013)
    plane: 2
    role: Holds checklist progress, resume drafts and the family packet. Nothing a vault rule reads.
    may_issue_determinations: false
    may_pull_from_agents: false
    highest_class_held: V2
    exposes: []
  - agent_id: claims_navigator_agent
    name: Claims Navigator
    plane: 3
    role: Explains claim steps and points to accredited representatives. Holds condition details (V4); exposes nothing.
    may_issue_determinations: false
    may_pull_from_agents: false
    highest_class_held: V4
    exposes: []
  - agent_id: crisis_support_agent
    name: Crisis Support
    plane: 3
    role: Shows the crisis floor. Holds nothing a vault rule may read (V5); exposes nothing.
    may_issue_determinations: false
    may_pull_from_agents: false
    highest_class_held: V5
    exposes: []

caveats:
  state_definition_trap: >-
    Many state benefits use the state's own definition of a veteran, which often requires federal
    active duty. Guard or Reserve service of only drills, annual training or State Active Duty may
    not meet it (Texas Hazlewood, for example, needs 181 days). Check with the state veterans agency.
  guard_post911: >-
    For Guard and Reserve members, drills, annual training and State Active Duty do not count toward
    the Post-9/11 GI Bill; qualifying federal active duty does.
  rudisill_contested: >-
    The 48-month rule for two service periods was decided for the Montgomery and Post-9/11 GI Bills.
    Whether it reaches the Selected Reserve GI Bill (Chapter 1606) is contested.
  army_approval_lead: >-
    Unchecked lead: since March 19, 2026 Army Tuition Assistance and Credentialing Assistance requests
    may need supervisor or commander approval in ArmyIgnitED. Confirm with your education center.
  commercial: >-
    This is a company's offer, not a government benefit. Offers change often; confirm the current
    terms on the company's page. VetBuddy does not endorse any company.
  nonprofit: >-
    A private organization runs this program, not the government. Confirm the current terms with
    the organization.
  seen_in_search: >-
    VetBuddy saw this link in search results but could not read the page, so the description may be
    incomplete.
  not_verified: >-
    No reviewer has checked this record yet. Read the official page before relying on it.
  tail_unread: >-
    Part of the source page was not read, so other benefits from this state or territory may be missing.
  uncertain_facts: >-
    This depends on answers you marked as unsure. Your documents, such as a DD 214 or a VA rating
    letter, settle them.
  mode_a_dropped: >-
    Some answers were not used because a guest search holds only basic facts. A private account can
    use rating, discharge and award answers.
  stale: >-
    The source page was last read more than the review period ago and may have changed.
  superseded: >-
    This rule was replaced. It is shown only so you can see what changed.
  recovered_lead: >-
    This lead came from an earlier VetBuddy dataset, not from a page read for the vault. Treat it as
    a pointer only.

# Rule leads (from the slice 02 Guard and Reserve dataset) attached to records.
lead_links:
  us.post-9-11-gi-bill-chapter-33: [gr.ch33]
  us.montgomery-gi-bill-selected-reserve-chapter-1606: [gr.ch1606]
  us.military-tuition-assistance: [gr.fta]
  us.army-tuition-assistance-armyignited: [gr.fta, gr.army_ca]
  us.extra-entitlement-for-two-or-more-service-periods-rudisill: [gr.rudisill]

# Caveats attached to specific records (in addition to the automatic ones).
record_caveats:
  us.post-9-11-gi-bill-chapter-33: [guard_post911]
  us.extra-entitlement-for-two-or-more-service-periods-rudisill: [rudisill_contested]
  us.army-tuition-assistance-armyignited: [army_approval_lead]

# Recovered recreation leads checked against records read for the vault.
