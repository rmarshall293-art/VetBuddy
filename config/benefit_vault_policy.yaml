         note: "The lead describes a disabled-veteran discount; the Alabama record read for the vault is the Parks for Patriots program."}
  RB04: {benefit_id: null, relation: none, note: "Single-park discount; no record read for the vault."}
  RB05: {benefit_id: null, relation: none, note: "Single-park discount; no record read for the vault."}
