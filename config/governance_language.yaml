# Required and prohibited language (Agent Governance Rules, 20 Oct 2026, §7).
# Single versioned source: OutputGuard / ClaimsBoundaryGuard read these, legal
# review edits them in one place, and no prompt or route restates them.
# Engineering governance text, not legal advice: §2, §5 and §7 need review by a
# veterans-benefits attorney or accredited claims agent before public launch.
version: "2026-10-20"

standard_disclaimer: >
  VetBuddy provides information and recommendations only. It does not guarantee
  any benefit, rating, or outcome, and it is not a substitute for an accredited
  representative. VA alone decides eligibility and disability ratings.

vso_referral_block: >
  For help preparing or filing a VA claim, work with a VA-accredited Veterans
  Service Organization representative, claims agent, or attorney. Accredited VSO
  help is free. You can find one using VA's accredited representative search, or
  through a VSO such as The American Legion, DAV, or VFW.

vso_search_url: "https://www.va.gov/get-help-from-accredited-representative/find-rep/"

# Master prompt v6 §5 common notice (verbatim). Shown in full where
# recommendations are explained; standard_disclaimer above is the short
# contextual version for footers and individual actions.
common_notice: >
  VetBuddy is an independent information and organization platform, not VA,
  DoD or a government agency. Its benefit matches, career suggestions and form
  assistance are recommendations based on the information you provide and
  identified sources. They are not the law, an official eligibility or rating
  decision, medical advice, a diagnosis, a medical nexus opinion, legal
  representation or a guarantee of approval. The responsible agency determines
  eligibility and benefits. Verify current requirements with the administering
  agency and, for VA claims assistance, a currently VA-accredited
  representative, claims agent or attorney. Check any separate professional
  license with the appropriate state authority.

# Master prompt v6 §4 privacy language. IMPLEMENTATION TARGET, NOT PUBLISHABLE:
# v6 forbids publishing it before the data-flow inventory, processor contracts
# and a verified legal operator exist. No surface renders it; the release gate
# test checks that it stays unrendered until legal_operator is set.
privacy_notice_draft: >
  VetBuddy does not sell your personal information or share it for
  cross-context behavioral advertising. You can browse public benefits as a
  guest without creating an account. Guest searches are not saved as a
  personal profile. Our systems and service providers process limited
  technical information needed to deliver and secure the service, as described
  in this policy. If you create an account, we store the account details and
  information you choose to save so we can provide those features. We use
  approved service providers only for disclosed service purposes and do not
  permit them to use your personal content to train their models. Personal
  information is sent to an external AI service only after the required
  disclosure and your explicit permission. Sharing with a representative or
  organization requires your authorization or another applicable lawful basis.
  You can manage consent, export information and request account deletion. Our
  retention schedule explains any limited legal, security and backup exceptions.

# Release-blocking operator fields (v6 §4, §15). Never invent these; old
# documents disagree on the legal entity (Master Record §7.1 rows 1–3).
legal_operator: null
privacy_contact: null
public_origin: null

cfr_reference_label: >
  This is VA's published regulation, shown for reference. It explains how VA
  describes criteria; it is not an assessment of your condition.

resume_label: >
  Draft built from the information you provided. Review every line before you use it.

# Starter pattern set. Matching is phrase-level on normalized text (lower case,
# punctuation folded, whitespace collapsed), never exact substrings — the
# Education Navigator defect was exact matching that missed natural phrasing.
# Each entry is a regular expression applied to normalized text.
prohibited:
  guarantee:
    allowed_alternative: "you may be eligible to explore; worth asking your rep about"
    patterns:
      - "\\byou will (get|receive|be paid)\\b"
      - "\\byou qualify for\\b"
      - "\\byou are eligible for\\b"
      - "\\bguaranteed?\\b"
      - "\\byou(?: a|')?re owed\\b"
  rating:
    allowed_alternative: "VA's rating criteria for this are in 38 CFR 4.x"
    patterns:
      - "\\byou should be rated\\b"
      - "\\bthis is worth \\d{1,3} ?(%|percent)"
      - "\\blikely \\d{1,3} ?(%|percent)"
      - "\\byour rating (will|would) be\\b"
  diagnosis:
    allowed_alternative: "talk to your health care provider about these symptoms"
    patterns:
      - "\\byou have (ptsd|tbi|sleep apnea|depression|anxiety)\\b"
      - "\\bthis sounds like (ptsd|tbi|sleep apnea|depression|anxiety)\\b"
  representation:
    allowed_alternative: "an accredited representative can file for you"
    patterns:
      - "\\bwe(?: wi)?ll file (it )?for you\\b"
      - "\\byour claim agent\\b"
      - "\\bwe represent you\\b"
      - "\\bfile for you\\b(?<!representative can file for you)"
  claim_coaching:
    allowed_alternative: "bring your questions to your accredited representative"
    patterns:
      - "\\btell the examiner\\b"
      - "\\bdescribe it as\\b"
      - "\\bdon'?t mention\\b"
  fees:
    allowed_alternative: "none; no claim-related fee exists"
    patterns:
      - "\\$\\s?\\d[\\d,]*(\\.\\d\\d)? (to|for) (file|appeal|increase)"
      - "\\b(fee|price) (for|to) (file|appeal|increase your rating)\\b"
