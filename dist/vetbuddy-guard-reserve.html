      l.source_opened ? " (opened by VetBuddy)" : " (not opened)") : null);
}

// ── Browse ─────────────────────────────────────────────────────────────────
const bstate = { q: "", j: "", c: "", only: true, limit: 50 };
function browse() {
  const juris = [...new Set(GR.records.map(r => r[COL.jurisdiction]))].sort((a, b) => a === "US" ? -1 : b === "US" ? 1 : jname(a).localeCompare(jname(b)));
  const cats = [...new Set(GR.records.map(r => r[COL.category]))].sort((a, b) => cat(a).localeCompare(cat(b)));
  const results = el("div", {});
  const count = el("p", { class: "small muted", "aria-live": "polite" });
  function run() {
    const q = bstate.q.trim().toLowerCase();
    const hits = GR.records.filter(r => (!bstate.only || r[COL.selected]) && (!bstate.j || r[COL.jurisdiction] === bstate.j)
      && (!bstate.c || r[COL.category] === bstate.c)
      && (!q || [r[COL.title], r[COL.who_it_is_for], r[COL.value]].join(" ").toLowerCase().includes(q)));
    count.textContent = `${hits.length} record${hits.length === 1 ? "" : "s"}. Reference only: browsing doesn't compare anything to anyone.`;
    results.replaceChildren(...hits.slice(0, bstate.limit).map(r => recordCard(r[COL.benefit_id])),
      hits.length > bstate.limit ? el("button", { class: "btn", type: "button", onclick: () => { bstate.limit += 100; run(); } }, "Show more") : "");
  }
  const card = el("div", { class: "card" },
    el("div", { class: "controls" },
      el("div", {}, el("label", { class: "f", for: "bq" }, "Search"),
        el("input", { id: "bq", type: "search", value: bstate.q, placeholder: "TRICARE, tuition, retired pay…", oninput: e => { bstate.q = e.target.value; bstate.limit = 50; run(); } })),
      el("div", {}, el("label", { class: "f", for: "bj" }, "Place"),
        el("select", { id: "bj", onchange: e => { bstate.j = e.target.value; bstate.limit = 50; run(); } }, el("option", { value: "" }, "All"),
          juris.map(j => el("option", { value: j, selected: j === bstate.j }, jname(j))))),
      el("div", {}, el("label", { class: "f", for: "bc" }, "Kind"),
        el("select", { id: "bc", onchange: e => { bstate.c = e.target.value; bstate.limit = 50; run(); } }, el("option", { value: "" }, "All"),
          cats.map(c => el("option", { value: c, selected: c === bstate.c }, cat(c)))))),
    el("p", { class: "small" }, el("label", {}, el("input", { type: "checkbox", checked: bstate.only, onchange: e => { bstate.only = e.target.checked; bstate.limit = 50; run(); } }),
      " Only records the Guard & Reserve agent selects")), count);
  run();
  return el("div", {}, card, el("div", { class: "card" }, results));
}

// ── About ──────────────────────────────────────────────────────────────────
function about() {
  const m = GR.manifest;
  return el("div", {},
    el("div", { class: "card" }, el("h2", {}, "What this page is"),
      el("p", {}, "A snapshot of VetBuddy's Guard & Reserve agent, run on synthetic service profiles to test it. The build script runs the real agent on the server for each profile, under both production rules and the test environment, and saves its answers here with the agent's own fingerprints."),
      el("p", {}, "It is not the live app. It stores nothing and sends nothing. To test new profiles, add them to data/synthetic/guard_reserve_personas.json and run scripts/build_guard_reserve_html.py."),
      el("p", { class: "small muted" }, GR.governing_rule)),
    el("div", { class: "card" }, el("h2", {}, "Agent"),
      el("dl", { class: "kv" },
        el("dt", {}, "Agent"), el("dd", {}, el("code", {}, m.agent_id), ` (a role of `, el("code", {}, GR.role.parent_agent), ")"),
        el("dt", {}, "Plane"), el("dd", {}, String(m.plane)),
        el("dt", {}, "Issues determinations"), el("dd", {}, m.may_issue_determinations ? "Yes" : "No"),
        el("dt", {}, "Pulls from other agents"), el("dd", {}, m.may_pull_from_agents ? "Yes" : "No"),
        el("dt", {}, "Policy"), el("dd", {}, `${GR.role.policy_version} · `, el("code", {}, GR.role.policy_sha256.slice(0, 16) + "…")),
        el("dt", {}, "Registry"), el("dd", {}, `${GR.registry.version}, ${GR.registry.records.toLocaleString()} records, as of ${GR.registry.as_of} · `, el("code", {}, GR.registry.sha256.slice(0, 16) + "…")),
        el("dt", {}, "Records shown here"), el("dd", {}, `${GR.records.length} (${GR.records.filter(r => r[COL.selected]).length} selected by the agent)`))),
    el("div", { class: "card" }, el("h2", {}, "Run fingerprints"),
      el("p", { class: "small muted" }, "Input and output hashes from each run. The same profile and registry always give the same hashes."),
      el("div", { class: "tbl" }, el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Profile"), el("th", {}, "Rules"), el("th", {}, "Input"), el("th", {}, "Output"))),
        el("tbody", {}, GR.personas.flatMap(p => Object.keys(p.env).map(k => el("tr", {},
          el("td", {}, p.id), el("td", {}, ENV_LABEL[k]), el("td", {}, el("code", {}, p.env[k].hashes.inputs.slice(0, 12))),
          el("td", {}, el("code", {}, p.env[k].hashes.output.slice(0, 12)))))))))),
    el("div", { class: "card" }, el("h2", {}, "What the results mean"),
      el("dl", { class: "kv" }, ORDER.map(o => [el("dt", {}, chip(o)), el("dd", { class: "small" }, el("code", {}, o))]))),
    el("div", { class: "card" }, el("h2", {}, "Research gaps the agent tracks"),
      el("div", { class: "tbl" }, el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Gap"), el("th", {}, "Topic"), el("th", {}, "Status"), el("th", {}, "Records"))),
        el("tbody", {}, GR.research_gaps.map(g => el("tr", {}, el("td", {}, g.id), el("td", {}, g.topic), el("td", {}, el("code", {}, g.status)), el("td", {}, String((g.records || []).length)))))))));
}

const TABS = { people, browse, about };
let tab = "people";
function show() { $("#main").replaceChildren(TABS[tab]()); }
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  show();
}));
show();
})();
</script>
</body>
</html>
