# Local development only. Synthetic data only. Passwords below are local
# placeholders for a throwaway container, not secrets; never reuse them.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vetbuddy_owner
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: vetbuddy
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetbuddy_owner -d vetbuddy"]
      interval: 2s
      retries: 30

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://vetbuddy_owner:local-dev-only@db:5432/vetbuddy
      APP_DB_LOGIN: vetbuddy_api
      APP_DB_PASSWORD: local-dev-only-api
    command: ["python", "-m", "app.migrate"]

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on: { migrate: { condition: service_completed_successfully } }
    environment:
      ENVIRONMENT: development
      APP_DATABASE_URL: postgresql://vetbuddy_api:local-dev-only-api@db:5432/vetbuddy
      AUTH_MODE: dev
      AUTH_DEV_SECRET: local-dev-only-not-a-secret-0123456789abcdef
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]

  web:
    image: node:22-alpine
    working_dir: /web
    volumes: ["./frontend:/web"]
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm ci && npx vite --host 0.0.0.0"
    ports: ["5173:5173"]
