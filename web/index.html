<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VetBuddy — Mission Brief</title>
<meta name="description" content="VetBuddy: your transition mission, one honest next step at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/" aria-label="VetBuddy home">
      <span class="brand-mark" aria-hidden="true">VB</span>
      <span class="brand-name disp">VetBuddy</span>
    </a>
    <nav class="nav" aria-label="Primary" id="nav"></nav>
    <button class="help" id="help-btn" type="button" aria-haspopup="dialog">Help me now</button>
  </div>
  <div class="devbar mono" id="devbar" hidden></div>
</header>
<main id="main" tabindex="-1"></main>
<dialog id="help" aria-labelledby="help-title">
  <div class="dialog-body">
    <h2 id="help-title" class="disp">Help, right now</h2>
    <p>If you are in crisis or thinking about harming yourself, reach a person now. These lines are free and confidential.</p>
    <ul id="help-list" class="help-list"></ul>
    <p class="small">If you are in immediate danger, call 911.</p>
    <form method="dialog"><button class="btn" type="submit">Close</button></form>
  </div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
